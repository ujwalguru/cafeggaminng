kind = "web"
previewPath = "/"
title = "Airavoto Gaming POS"
description = "Marketing website for Airavoto Gaming POS, a free all-in-one gaming center management system covering sessions, bookings, food & inventory, expenses, and reporting. Includes home, features, blog, FAQ, download, changelog, roadmap, privacy and terms pages."
version = "1.0.0"
id = "artifacts/airavoto-pos"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20859

[services.development]
run = "pnpm --filter @workspace/airavoto-pos run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/airavoto-pos", "run", "build" ]
serve = "static"
publicDir = "artifacts/airavoto-pos/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20859"
BASE_PATH = "/"
