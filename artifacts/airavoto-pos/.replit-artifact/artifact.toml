kind = "web"
previewPath = "/"
title = "Airavoto Cafe"
description = "Gaming cafe discovery platform — search, filter, and explore gaming cafes by city, game type, and availability. Includes cafe detail pages, owner listing submission, and a blog."
version = "1.0.0"
id = "artifacts/airavoto-pos"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/airavoto-pos run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/airavoto-pos", "run", "build" ]
serve = "static"
publicDir = "artifacts/airavoto-pos/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/"
